<script>
/* =========================================================
   COACH JP — MOTOR COMPLETO DEL CLIENTE (v3.1)
   Inicia semana, días, bloques, timer, PRs y sincronización.
   ========================================================= */
(function(){
  'use strict';

  /* 0 · VARIABLES GLOBALES Y ESTADO */
  window.COACH_DISCIPLINA = String(PROGRAM_CONFIG.disciplina || 'crossfit').toLowerCase();
  window.COACH_MODO_SEMANAL = !!PROGRAM_CONFIG.modoSemanal;
  window.COACH_WEEKS = Array.isArray(PROGRAM_CONFIG.weeks) && PROGRAM_CONFIG.weeks.length ? PROGRAM_CONFIG.weeks : [
    {id:0, short:'S1', name:'Semana 1', phase:'Carga Base', rpe:'RPE 7-8'},
    {id:1, short:'S2', name:'Semana 2', phase:'Sobrecarga', rpe:'RPE 8-9'},
    {id:2, short:'S3', name:'Semana 3', phase:'Pico de Exigencia', rpe:'RPE 9-10'},
    {id:3, short:'S4', name:'Semana 4', phase:'Descarga (Deload)', rpe:'RPE 6-7'}
  ];

  /* Días de la semana según disciplina */
  const DIAS_CROSSFIT = [
    {id:0, name:'Lunes', label:'Fuerza &amp; Halterofilia', blocks:[
      {
        type:'strength',
        title:'Bloque A · Halterofilia Base (Power Snatch)',
        subtitle:'Potencia de salida y doble extensión en arranque',
        exercises:[
          {name:'Power Snatch', detail:'5 sets × 3 reps @ RPE 7-8', load:'50-65% 1RM', rest:'90s', rpe:'8', rir:'2', tempo:'2010', note:'Búsqueda de velocidad y bloqueo estable arriba.'},
          {name:'Snatch Balance', detail:'4 sets × 3 reps', load:'Moderado', rest:'90s', rpe:'7', rir:'3', tempo:'2011', note:'Confianza en la recepción profunda.'}
        ],
        notes:'Foco en la transición rápida de cadera a hombros.'
      },
      {
        type:'metcon',
        title:'Bloque B · MetCon Táctico (For Time)',
        subtitle:'Alta densidad metabólica y transferencia de fuerza',
        exercises:[
          {name:'RowErg', detail:'1000m iniciales', load:'Z3 Sostenido', rest:'0s', rpe:'8', rir:'2', tempo:'-', note:'Ritmo crucero sin quemarse en los primeros 300m.'},
          {name:'Wall balls', detail:'50 repeticiones (9kg / 6kg)', load:'Unbroken o series de 15', rest:'30s', rpe:'8', rir:'2', tempo:'-', note:'Sentadilla profunda y salida explosiva de cadera.'},
          {name:'Toes to bar', detail:'30 repeticiones estrictas', load:'Puro core', rest:'0s', rpe:'9', rir:'1', tempo:'-', note:'Control del péndulo, evitar impulso lumbar excesivo.'}
        ],
        notes:'Time Cap: 14 minutos.'
      }
    ]},
    {id:1, name:'Martes', label:'Gymnastics &amp; Motor', blocks:[
      {
        type:'warmup',
        title:'Bloque A · Activación Articular y Escapular',
        subtitle:'Movilidad torácica y preparación de hombros',
        exercises:[
          {name:'Band Pull Appart', detail:'3 rondas × 15 reps', load:'Banda liviana', rest:'30s', rpe:'6', rir:'4', tempo:'2011', note:'Foco en la retracción posterior.'},
          {name:'Hollow Rocks', detail:'3 rondas × 30 segundos', load:'Peso corporal', rest:'30s', rpe:'7', rir:'3', tempo:'1010', note:'Tensión abdominal constante.'}
        ],
        notes:'Preparación específica para gimnásticos.'
      },
      {
        type:'strength',
        title:'Bloque B · Gymnastics Skill (HSPU &amp; TTB)',
        subtitle:'Eficiencia en el movimiento gimnástico complejo',
        exercises:[
          {name:'Strict HSPU', detail:'5 sets × 5 reps', load:'Con déficit opcional', rest:'120s', rpe:'8', rir:'2', tempo:'3010', note:'Control absoluto de la bajada.'},
          {name:'Chest to Bar Pull-ups', detail:'4 sets × 8 reps', load:'Kipping eficiente', rest:'90s', rpe:'8', rir:'2', tempo:'-', note:'Contacto firme del pecho con la barra.'}
        ],
        notes:'Priorizar calidad técnica ante fatiga.'
      }
    ]},
    {id:2, name:'Miércoles', label:'Active Recovery / Aeróbico', blocks:[
      {
        type:'cardio',
        title:'Bloque A · Zona 2 Aeróbica (Base)',
        subtitle:'Recuperación activa y desarrollo mitocondrial',
        exercises:[
          {name:'Assault bike', detail:'45 minutos continuos', load:'Zona 2 (FC 120-140 lpm)', rest:'0s', rpe:'4', rir:'6', tempo:'-', note:'Ritmo estrictamente conversacional.'}
        ],
        notes:'Sesión clave para la asimilación del volumen semanal.'
      }
    ]},
    {id:3, name:'Jueves', label:'Fuerza &amp; Clean Complex', blocks:[
      {
        type:'strength',
        title:'Bloque A · Clean &amp; Jerk Complex',
        subtitle:'Desarrollo de fuerza explosiva y coordinación',
        exercises:[
          {name:'Hang Power Clean', detail:'5 sets × 3 reps', load:'65-75% 1RM', rest:'90s', rpe:'8', rir:'2', tempo:'2010', note:'Fuerte extensión de rodillas.'},
          {name:'Front Squat', detail:'4 sets × 4 reps', load:'75-80% 1RM', rest:'120s', rpe:'8.5', rir:'1.5', tempo:'3010', note:'Codos bien arriba en todo el recorrido.'}
        ],
        notes:'Mantener el torso vertical en la sentadilla frontal.'
      },
      {
        type:'metcon',
        title:'Bloque B · MetCon Intervalado (EMOM 16 min)',
        subtitle:'Potencia láctica y tolerancia a la fatiga',
        exercises:[
          {name:'SkiErg', detail:'Minuto impar: 18 calorías', load:'Alta potencia', rest:'30s', rpe:'8.5', rir:'1', tempo:'-', note:'Uso coordinado de dorsal y cadera.'},
          {name:'Burpee Box Jump Over', detail:'Minuto par: 12 repeticiones', load:'Cajón 60cm / 50cm', rest:'30s', rpe:'9', rir:'1', tempo:'-', note:'Fluidez sin pausa innecesaria arriba.'}
        ],
        notes:'Ritmo constante de principio a fin.'
      }
    ]},
    {id:4, name:'Viernes', label:'Endurance &amp; Core', blocks:[
      {
        type:'metcon',
        title:'Bloque A · WOD Long Engine (AMRAP 25 min)',
        subtitle:'Capacidad aeróbica extendida y resistencia muscular',
        exercises:[
          {name:'Remo en ergómetro (Rowerg)', detail:'400 metros', load:'Constante', rest:'0s', rpe:'7.5', rir:'2', tempo:'-', note:'Eficiencia de brazada.'},
          {name:'Single arm DB hang power snatches', detail:'20 repeticiones (alternando)', load:'22.5kg / 15kg', rest:'0s', rpe:'8', rir:'2', tempo:'-', note:'Cadencia fluida.'},
          {name:'Double Unders', detail:'60 repeticiones', load:'Unbroken buscado', rest:'30s', rpe:'8', rir:'2', tempo:'-', note:'Muñecas firmes y postura erguida.'}
        ],
        notes:'Buscar una cantidad de rondas uniforme en cada bloque de 5 min.'
      }
    ]}
  ];

  window.COACH_DIAS = DIAS_CROSSFIT;

  /* Estado local persistente */
  window.currentWeek = 0;
  window.currentDay = 0;
  window.completedDays = {};
  window.userInputs = {};
  window.fatigueState = {};
  window.readinessState = {};
  window.unitMode = 'kg';
  window.audioEnabled = true;
  window.activeMode = 'complete';

  /* Cargar estado de localStorage si existe */
  try {
    const savedW = localStorage.getItem('coachjp_week');
    if(savedW !== null) window.currentWeek = parseInt(savedW, 10) || 0;
    const savedD = localStorage.getItem('coachjp_day');
    if(savedD !== null) window.currentDay = parseInt(savedD, 10) || 0;
    const savedDone = localStorage.getItem('coachjp_done');
    if(savedDone) window.completedDays = JSON.parse(savedDone) || {};
    const savedInputs = localStorage.getItem('coachjp_inputs');
    if(savedInputs) window.userInputs = JSON.parse(savedInputs) || {};
    const savedU = localStorage.getItem('coachjp_unit');
    if(savedU) window.unitMode = savedU;
  } catch(e){}

  /* Guardar estado */
  window.jpGuardarEstado = function(){
    try {
      localStorage.setItem('coachjp_week', window.currentWeek);
      localStorage.setItem('coachjp_day', window.currentDay);
      localStorage.setItem('coachjp_done', JSON.stringify(window.completedDays));
      localStorage.setItem('coachjp_inputs', JSON.stringify(window.userInputs));
      localStorage.setItem('coachjp_unit', window.unitMode);
    } catch(e){}
  };

  /* 1 · RENDERIZAR SELECTOR DE SEMANAS Y PESTAÑAS DE DÍAS */
  window.renderApp = function(){
    const wSel = document.getElementById('weekSelector');
    if(wSel){
      wSel.innerHTML = window.COACH_WEEKS.map((w, idx) => `
        <button type="button" class="week-pill ${idx === window.currentWeek ? 'active' : ''}" data-week="${idx}">
          <span class="week-pill-name">${w.short} · ${w.name}</span>
          <span class="week-pill-phase">${w.phase}</span>
        </button>
      `).join('');
      wSel.querySelectorAll('.week-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          window.currentWeek = parseInt(btn.getAttribute('data-week'), 10);
          window.jpGuardarEstado();
          window.renderApp();
        });
      });
    }

    const tWrap = document.getElementById('week-tabs');
    if(tWrap){
      tWrap.innerHTML = window.COACH_DIAS.map((d, idx) => {
        const isDone = !!window.completedDays[`w${window.currentWeek}_d${idx}`];
        return `
          <div class="day-tab ${idx === window.currentDay ? 'active' : ''} ${isDone ? 'completed-day' : ''}" data-day="${idx}">
            <span class="tab-name">${d.name}</span>
            <span class="tab-label">${d.label.split('&')[0]}</span>
            <div class="day-dot"></div>
          </div>
        `;
      }).join('');
      tWrap.querySelectorAll('.day-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          window.currentDay = parseInt(tab.getAttribute('data-day'), 10);
          window.jpGuardarEstado();
          window.renderApp();
          window.scrollTo({top: 0, behavior:'smooth'});
        });
      });
    }

    /* Actualizar insignia de semana activa */
    const wBadge = document.getElementById('weekActiveBadge');
    const wObj = window.COACH_WEEKS[window.currentWeek] || window.COACH_WEEKS[0];
    if(wBadge){
      wBadge.innerHTML = `<span class="wab-dot"></span><span class="wab-text">Entrenando en: <b>${wObj.name}</b> (${wObj.phase}) — ${wObj.rpe}</span>`;
    }

    /* Renderizar vista del día actual */
    const main = document.getElementById('mainContent');
    if(main){
      const dia = window.COACH_DIAS[window.currentDay] || window.COACH_DIAS[0];
      const doneKey = `w${window.currentWeek}_d${window.currentDay}`;
      const isDayDone = !!window.completedDays[doneKey];

      let html = `
        <div class="day-view active">
          <div class="day-header">
            <div>
              <div class="day-eyebrow">Día ${window.currentDay + 1} de ${window.COACH_DIAS.length} · ${wObj.name}</div>
              <h2 class="day-title jp-session-main">${dia.name} — ${dia.label}</h2>
              <div class="jp-session-emphasis">${wObj.phase}</div>
              <div class="day-meta-row">
                <span class="meta-chip">⚡ RPE Objetivo: ${wObj.rpe}</span>
                <span class="meta-chip">🎯 Enfoque: Alta Densidad</span>
              </div>
            </div>
          </div>

          <!-- Readiness / Check-in de Entrada -->
          <details class="readiness-card ${window.readinessState[doneKey] ? 'rdy-done' : ''}">
            <summary class="rdy-summary">
              <span class="rdy-sum-ic">🧠</span>
              <span class="rdy-sum-tx" id="rdySummaryText_${window.currentWeek}_${window.currentDay}">Check-in de Entrada &amp; Estado Diario</span>
              <span class="rdy-sum-tag">Obligatorio</span>
              <span class="rdy-chev">▼</span>
            </summary>
            <div class="rdy-body">
              <div class="rdy-q">
                <span class="rdy-lb">1 · ¿Cómo dormiste anoche?</span>
                <div class="rdy-seg" data-rdy-type="sleep" data-wk="${window.currentWeek}" data-dy="${window.currentDay}">
                  <button type="button" data-val="1">Flojo (&lt;5h)</button>
                  <button type="button" data-val="2">Normal (6-7h)</button>
                  <button type="button" data-val="3" class="on">Óptimo (8h+)</button>
                </div>
              </div>
              <div class="rdy-q">
                <span class="rdy-lb">2 · Nivel de energía percibido hoy</span>
                <div class="rdy-seg" data-rdy-type="energy" data-wk="${window.currentWeek}" data-dy="${window.currentDay}">
                  <button type="button" data-val="1">Fatigado</button>
                  <button type="button" data-val="2" class="on">Estable</button>
                  <button type="button" data-val="3">Al 100%</button>
                </div>
              </div>
              <div class="rdy-q">
                <span class="rdy-lb">3 · ¿Alguna molestia articular o sobrecarga?</span>
                <div class="rdy-pills" data-rdy-type="pain" data-wk="${window.currentWeek}" data-dy="${window.currentDay}">
                  <button type="button" class="rdy-pill on" data-val="none"><span class="flag"></span>Ninguna</button>
                  <button type="button" class="rdy-pill" data-val="hombro"><span class="flag"></span>Hombro</button>
                  <button type="button" class="rdy-pill" data-val="rodilla"><span class="flag"></span>Rodilla</button>
                  <button type="button" class="rdy-pill" data-val="espalda"><span class="flag"></span>Espalda baja</button>
                </div>
              </div>
              <div class="rdy-advisory" id="rdyAdvisory_${window.currentWeek}_${window.currentDay}">
                <b>Estado óptimo:</b> Sistema nervioso listo para la sobrecarga progresiva programada. Respetá los descansos.
              </div>
            </div>
          </details>

          <!-- Bloques de entrenamiento -->
          <div class="blocks-stack">
      `;

      dia.blocks.forEach((blk, bIdx) => {
        let catClass = 'cat-strength';
        let biClass = 'bi-strength';
        let blClass = 'bl-strength';
        let iconChar = '⚡';
        if(blk.type === 'warmup'){ catClass='cat-warmup'; biClass='bi-warmup'; blClass='bl-warmup'; iconChar='🔥'; }
        else if(blk.type === 'metcon'){ catClass='cat-metcon'; biClass='bi-metcon'; blClass='bl-metcon'; iconChar='⏱️'; }
        else if(blk.type === 'cardio'){ catClass='cat-cardio'; biClass='bi-cardio'; blClass='bl-cardio'; iconChar='❤️'; }
        else if(blk.type === 'accessory'){ catClass='cat-accessory'; biClass='bi-accessory'; blClass='bl-accessory'; iconChar='🛡️'; }

        const blockDoneKey = `w${window.currentWeek}_d${window.currentDay}_b${bIdx}`;
        const isBlockDone = !!window.completedDays[blockDoneKey];

        html += `
          <div class="block ${catClass} ${isBlockDone ? 'block-done' : ''}" id="block_${bIdx}">
            <div class="block-header" data-block-idx="${bIdx}">
              <div class="block-icon ${biClass}">${iconChar}</div>
              <div class="block-header-text">
                <div class="block-label ${blClass}">${blk.title}</div>
                <div class="block-subtitle">${blk.subtitle}</div>
              </div>
              <div class="block-check" onclick="event.stopPropagation()">
                <input type="checkbox" id="chk_b_${bIdx}" ${isBlockDone ? 'checked' : ''} onchange="window.jpToggleBlock(${bIdx}, this.checked)" title="Marcar bloque completado" />
              </div>
              <div class="block-chevron">▼</div>
            </div>
            <div class="block-body">
        `;

        if(blk.exercises && blk.exercises.length){
          blk.exercises.forEach((ex, eIdx) => {
            const inputKey = `w${window.currentWeek}_d${window.currentDay}_b${bIdx}_e${eIdx}`;
            const exData = window.userInputs[inputKey] || {kg:'', reps:'', done:false};
            const vidCode = PROGRAM_CONFIG.videoMap[ex.name] || PROGRAM_CONFIG.videoLib[ex.name] || '';

            html += `
              <div class="ex-row">
                <div class="ex-bullet"></div>
                <div style="flex:1;min-width:0">
                  <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">
                    <span class="ex-name">${ex.name}</span>
                    ${vidCode ? `<a class="video-link" onclick="window.openVideoPopup('${vidCode}', '${ex.name}')">▶ Ver técnica</a>` : ''}
                  </div>
                  <div class="ex-detail">Prescripción: <strong>${ex.detail}</strong> · Carga: ${ex.load} · Descanso: ${ex.rest}</div>
                  ${ex.note ? `<div style="font-size:0.78rem;color:var(--text-secondary);margin-top:2px;">💡 ${ex.note}</div>` : ''}
                </div>
              </div>
              <div class="set-tracker">
                <div class="set-row ${exData.done ? 'set-row-done' : ''}">
                  <span class="set-row-label">Serie 1</span>
                  <div style="display:flex;align-items:center;gap:6px">
                    <input type="number" step="0.5" inputmode="decimal" class="set-input set-kg" placeholder="Kg" value="${exData.kg || ''}" oninput="window.jpSaveInput('${inputKey}', 'kg', this.value)" />
                    <span style="color:var(--text-muted)">×</span>
                    <input type="number" inputmode="numeric" class="set-input set-reps" placeholder="Reps" value="${exData.reps || ''}" oninput="window.jpSaveInput('${inputKey}', 'reps', this.value)" />
                    <input type="checkbox" class="set-check" ${exData.done ? 'checked' : ''} onchange="window.jpSaveInput('${inputKey}', 'done', this.checked)" title="Completar serie" />
                  </div>
                </div>
              </div>
            `;
          });
        }

        if(blk.notes){
          html += `
            <div class="coach-note note-warn">
              <strong>Nota del Coach JP:</strong>
              ${blk.notes}
            </div>
          `;
        }

        /* Timer integrado para el bloque */
        html += `
              <div class="timer-box timer-compact">
                <div class="timer-box-label">Timer de Pausa / Bloque</div>
                <div class="timer-display" id="timerDisplay_${bIdx}">00:90</div>
                <div class="timer-controls-round">
                  <button type="button" class="tbtn-round tbtn-play" onclick="window.jpStartTimer(90, 'timerDisplay_${bIdx}')">▶ Iniciar 90s</button>
                  <button type="button" class="tbtn-round tbtn-reset-round" onclick="window.jpResetTimer('timerDisplay_${bIdx}', '90')">↺</button>
                </div>
              </div>
            </div>
          </div>
        `;
      });

      const isDayCompleted = !!window.completedDays[doneKey];
      html += `
          </div>
          <button type="button" class="day-complete-cta ${isDayCompleted ? 'done' : ''}" onclick="window.jpToggleDayComplete(${window.currentWeek}, ${window.currentDay})">
            <span class="dcc-ic">${isDayCompleted ? '✓' : '⚡'}</span>
            <span id="dayCompleteCtaText">${isDayCompleted ? 'Día Completado y Registrado' : 'Marcar Día Completo &amp; Guardar Avance'}</span>
          </button>
        </div>
      `;

      main.innerHTML = html;
      window.jpWireInteractions();
    }
  };

  /* 2 · INTERACCIONES Y EVENTOS */
  window.jpWireInteractions = function(){
    /* Plegar / desplegar bloques */
    document.querySelectorAll('.block-header').forEach(hdr => {
      hdr.addEventListener('click', (e) => {
        if(e.target.tagName === 'INPUT' || e.target.tagName === 'A') return;
        const block = hdr.closest('.block');
        if(block) block.classList.toggle('collapsed');
      });
    });

    /* Check-in Readiness interactivo */
    document.querySelectorAll('.rdy-seg button').forEach(btn => {
      btn.addEventListener('click', () => {
        const parent = btn.closest('.rdy-seg');
        parent.querySelectorAll('button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        const type = parent.getAttribute('data-rdy-type');
        const wk = parent.getAttribute('data-wk');
        const dy = parent.getAttribute('data-dy');
        const key = `w${wk}_d${dy}`;
        window.readinessState[key] = window.readinessState[key] || {};
        window.readinessState[key][type] = btn.getAttribute('data-val');
        
        const sumEl = document.getElementById(`rdySummaryText_${wk}_${dy}`);
        if(sumEl) sumEl.textContent = `Check-in Registrado (${btn.textContent})`;
      });
    });

    document.querySelectorAll('.rdy-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        const parent = pill.closest('.rdy-pills');
        parent.querySelectorAll('.rdy-pill').forEach(p => p.classList.remove('on'));
        pill.classList.add('on');
        const type = parent.getAttribute('data-rdy-type');
        const wk = parent.getAttribute('data-wk');
        const dy = parent.getAttribute('data-dy');
        const key = `w${wk}_d${dy}`;
        window.readinessState[key] = window.readinessState[key] || {};
        window.readinessState[key][type] = pill.getAttribute('data-val');
      });
    });
  };

  /* Guardar datos de inputs de series */
  window.jpSaveInput = function(key, field, val){
    window.userInputs[key] = window.userInputs[key] || {kg:'', reps:'', done:false};
    if(field === 'done') window.userInputs[key].done = !!val;
    else window.userInputs[key][field] = val;
    window.jpGuardarEstado();
  };

  /* Toggle Bloque completado */
  window.jpToggleBlock = function(bIdx, isChecked){
    const key = `w${window.currentWeek}_d${window.currentDay}_b${bIdx}`;
    window.completedDays[key] = isChecked;
    const blk = document.getElementById(`block_${bIdx}`);
    if(blk){
      if(isChecked) blk.classList.add('block-done', 'block-flash');
      else blk.classList.remove('block-done', 'block-flash');
    }
    window.jpGuardarEstado();
  };

  /* Toggle Día completo */
  window.jpToggleDayComplete = function(wk, dy){
    const key = `w${wk}_d${dy}`;
    const current = !!window.completedDays[key];
    window.completedDays[key] = !current;
    window.jpGuardarEstado();
    window.renderApp();
  };

  /* Timer básico */
  let activeTimerInterval = null;
  window.jpStartTimer = function(seconds, displayId){
    if(activeTimerInterval) clearInterval(activeTimerInterval);
    let rem = seconds;
    const disp = document.getElementById(displayId);
    if(!disp) return;
    
    activeTimerInterval = setInterval(() => {
      if(rem <= 0){
        clearInterval(activeTimerInterval);
        disp.textContent = "¡TIEMPO!";
        return;
      }
      rem--;
      const m = Math.floor(rem / 60);
      const s = rem % 60;
      disp.textContent = (m < 10 ? '0'+m : m) + ':' + (s < 10 ? '0'+s : s);
    }, 1000);
  };

  window.jpResetTimer = function(displayId, defSec){
    if(activeTimerInterval) clearInterval(activeTimerInterval);
    const disp = document.getElementById(displayId);
    if(disp){
      const m = Math.floor(parseInt(defSec, 10) / 60);
      const s = parseInt(defSec, 10) % 60;
      disp.textContent = (m < 10 ? '0'+m : m) + ':' + (s < 10 ? '0'+s : s);
    }
  };

  /* Popup de Video Técnicas */
  window.openVideoPopup = function(videoId, title){
    const wrap = document.getElementById('video-popup-wrap');
    const iframe = document.getElementById('video-popup-iframe');
    const fallback = document.getElementById('video-popup-fallback-link');
    if(wrap && iframe){
      iframe.src = `[https://www.youtube-nocookie.com/embed/$](https://www.youtube-nocookie.com/embed/$){videoId}?autoplay=1&rel=0`;
      if(fallback) fallback.href = `[https://www.youtube.com/watch?v=$](https://www.youtube.com/watch?v=$){videoId}`;
      wrap.classList.add('open');
    }
  };

  const vClose = document.getElementById('video-popup-close');
  if(vClose){
    vClose.addEventListener('click', () => {
      const wrap = document.getElementById('video-popup-wrap');
      const iframe = document.getElementById('video-popup-iframe');
      if(wrap) wrap.classList.remove('open');
      if(iframe) iframe.src = '';
    });
  }

  /* Modales de Guía y Calculadora 1RM */
  const guideBtn = document.getElementById('guideBtn');
  const guideModal = document.getElementById('guideModal');
  const guideClose = document.getElementById('guideClose');
  if(guideBtn && guideModal){
    guideBtn.addEventListener('click', () => guideModal.classList.add('open'));
  }
  if(guideClose && guideModal){
    guideClose.addEventListener('click', () => guideModal.classList.remove('open'));
  }

  const calcBtn = document.getElementById('calcBtn');
  const calcModal = document.getElementById('calcModal');
  const calcClose = document.getElementById('calcClose');
  if(calcBtn && calcModal){
    calcBtn.addEventListener('click', () => calcModal.classList.add('open'));
  }
  if(calcClose && calcModal){
    calcClose.addEventListener('click', () => calcModal.classList.remove('open'));
  }

  /* 3 · INICIALIZACIÓN AL CARGAR LA PÁGINA */
  document.addEventListener('DOMContentLoaded', () => {
    /* Soltar el splash de arranque */
    if(typeof window.__jpSoltarHold === 'function') window.__jpSoltarHold();
    if(typeof window.__jpLiberarUI === 'function') window.__jpLiberarUI();

    /* Poblar datos de perfil en el header si existen */
    const hdcName = document.getElementById('hdcName');
    if(hdcName && PROGRAM_CONFIG.athleteName) hdcName.textContent = PROGRAM_CONFIG.athleteName;

    const hdcPlan = document.getElementById('hdcPlanChip');
    if(hdcPlan) hdcPlan.textContent = PROGRAM_CONFIG.mesoName || 'Mesociclo Activo';

    const hdcPay = document.getElementById('hdcPayChip');
    if(hdcPay) hdcPay.textContent = 'Cuota Al Día';

    /* Render inicial de la app */
    window.renderApp();
  });

})();
</script>
</body>
</html>
